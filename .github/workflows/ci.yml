name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'modernized/reports/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'modernized/reports/**'

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Backend unit tests (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend unit tests
        run: mvn -B verify

  frontend-quality:
    name: Frontend lint, typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: modernized/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  docker-build:
    name: Docker image build (validation)
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t genapp-backend:${{ github.sha }} modernized/backend
      - name: Build frontend image
        run: docker build -t genapp-frontend:${{ github.sha }} modernized/frontend
