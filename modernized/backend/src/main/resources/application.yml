spring:
  application:
    name: genapp-backend
  datasource:
    url: jdbc:h2:mem:genapp;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

genapp:
  # Mirrors the Db2 GENERATED BY DEFAULT AS IDENTITY (START WITH 1000001)
  # for customerNumber and policyNumber: seeded rows use explicit 1..10 ids,
  # new rows continue from 1000001.
  first-identity-value: 1000001
